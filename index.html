<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schrank">
<meta name="theme-color" content="#eceee9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Digitaler Kleiderschrank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: einspaltige Handy-App. Kopfzeile oben, Tab-Leiste unten, Schrank als Raster aus Etiketten-Kacheln, Formulare als Bottom-Sheet. */
:root{
  --bg:#eceee9; --surface:#f8f9f6; --surface-2:#e1e4dd; --fg:#131920; --muted:#59626b; --line:#cdd2ca;
  --accent:#2b45c4; --accent-ink:#ffffff; --accent-soft:#dde2fa;
  --good:#2d7a4c; --warn:#9a5800; --bad:#b0281f; --icon-stroke:rgba(19,25,32,.3); --scrim:rgba(10,14,20,.45);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",-apple-system,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#171b21; --surface-2:#20262e; --fg:#e7eaee; --muted:#98a1ab; --line:#2b323b;
  --accent:#8b9cff; --accent-ink:#0c0f1e; --accent-soft:#232a4f;
  --good:#5cc489; --warn:#e0a24a; --bad:#ff7b72; --icon-stroke:rgba(231,234,238,.32); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#20262e; --fg:#e7eaee; --muted:#98a1ab; --line:#2b323b;
  --accent:#8b9cff; --accent-ink:#0c0f1e; --accent-soft:#232a4f;
  --good:#5cc489; --warn:#e0a24a; --bad:#ff7b72; --icon-stroke:rgba(231,234,238,.32); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
h1,h2,h3{font-family:var(--display);font-stretch:72%;text-transform:uppercase;letter-spacing:.04em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:28px;font-weight:780}
.h-sub{font-size:12px;color:var(--muted);margin-top:2px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:22px;height:22px}

main{max-width:760px;margin:0 auto;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{display:grid;gap:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;display:grid;justify-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

.fab{position:fixed;z-index:24;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:13px 20px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(20,30,80,.28)}

/* Filter */
.filters{display:grid;gap:10px}
input[type=search],input[type=text],input[type=date],select{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);min-width:0}
.scroller{overflow-x:auto;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.sel-row{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:8px}
.chip-row{display:flex;gap:8px;width:max-content}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dots{font-size:9px;letter-spacing:1px;vertical-align:1px;opacity:.75}

/* Galerie */
.grp{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:720;padding-top:6px;border-top:1px solid var(--line);padding-block-start:12px}
.grp .mono{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;overflow:hidden;min-width:0}
.ph{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:100%;background:var(--surface-2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.ph svg{width:68%;height:68%}
.star{position:absolute;top:5px;right:7px;color:var(--accent);font-size:15px}
.cnt{position:absolute;right:5px;bottom:5px;font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.bl{position:absolute;left:5px;bottom:5px;font-size:12px;line-height:1.3;background:var(--surface);border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:0 5px}
.exm{position:absolute;left:5px;top:5px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface);border:1px dashed var(--muted);border-radius:4px;padding:0 4px;color:var(--muted)}
.cap{display:grid;padding:7px 8px 8px;min-width:0}
.cap .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger,.link.danger{color:var(--bad)}
.btn[disabled]{opacity:.55}
.link{background:none;border:0;color:var(--accent);font-weight:500;padding:6px 2px;font-size:15px}
.link.strong{font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* Karten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.note{font-size:13px;margin:0;padding:9px 11px;border-radius:9px;background:var(--accent-soft)}
.warn{font-size:13px;margin:0;padding:9px 11px;border-radius:9px;border:1px solid var(--warn);color:var(--warn)}

/* Outfit */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:10px 4px;font-size:13px;font-weight:600;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.wx{grid-template-columns:auto minmax(0,1fr);align-items:center}
.wx-t{font-size:38px;font-weight:500;line-height:1;letter-spacing:-.02em}
.wx-l{font-weight:600}
.wx-s{font-size:12.5px;color:var(--muted)}
.wx-ctl{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent)}
.tgl{display:flex;align-items:center;gap:7px;font-weight:500;font-size:14px}
.tgl input{width:20px;height:20px;accent-color:var(--accent)}
.wx .hint{grid-column:1/-1}
.pinrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pinrow .btn.primary{margin-left:auto}
.pin{display:flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 4px 3px 3px;font-size:13.5px;font-weight:600;max-width:100%}
.pin .ph{width:32px;border-radius:999px}
.pin span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pin button{border:0;background:none;width:28px;height:28px;font-size:16px}
.oc-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.oc-h h3{font-size:17px;font-weight:720}
.oc-h .mono{font-size:11.5px;color:var(--muted)}
.oc-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.oi{display:grid;gap:3px;background:none;border:0;padding:0;text-align:left;min-width:0}
.oi .ph{border-radius:9px;border:1px solid var(--line)}
.oi-slot{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.oi-n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{margin:0;padding-left:18px;display:grid;gap:2px;font-size:13.5px}
.oc-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.oc-f .hint{flex:1;min-width:0}
.so{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.so-items{display:flex;gap:6px;flex-wrap:wrap}
.ph.xs{width:44px;border-radius:7px;border:1px solid var(--line)}
.so-m{grid-column:1/-1;display:flex;gap:10px;font-size:12.5px;color:var(--muted)}
.sec-h{font-size:17px;font-weight:720;padding-top:8px}

/* Packliste */
.pl{display:grid;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.pl h3{font-size:18px}
.pl-m{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--good);border-radius:99px}
.stats{display:grid;gap:8px}
.stats-row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.pg{display:grid}
.pg h3{font-size:15px;font-weight:720;color:var(--muted);padding:12px 0 4px;border-bottom:1px solid var(--line)}
.pr{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pr .ck{width:24px;height:24px;accent-color:var(--good)}
.pr .ph{border-radius:8px;border:1px solid var(--line)}
.pr-t{min-width:0;display:grid}
.pr-t .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-t .s{font-size:12px;color:var(--muted)}
.pr-a{display:flex;gap:12px}
.pr-a button{background:none;border:0;padding:3px 0;font-size:12.5px;color:var(--accent);font-weight:500}
.pr.done .n{text-decoration:line-through;color:var(--muted)}
.pr.wear{opacity:.75}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.step button{width:34px;height:34px;border:0;background:none;font-size:18px}
.step span{min-width:24px;text-align:center;font-size:14px}
.step.big button{width:44px;height:42px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;
  padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior:contain}
.sh-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sh-head h2{font-size:19px;font-weight:760;text-align:center}
.form{display:grid;gap:16px}
.fld{display:grid;gap:7px;min-width:0}
.fld i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:7px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.photo{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:start}
.ph.big{border-radius:12px;border:1px solid var(--line)}
.photo-acts{display:grid;gap:8px;justify-items:start}
.paste{min-height:44px;width:100%;border:1px dashed var(--muted);border-radius:9px;padding:10px;font-size:13px;color:var(--muted);-webkit-user-select:text;user-select:text}
.paste:empty::before{content:attr(data-ph)}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px 4px}
.link.more{justify-self:start;font-size:13.5px;padding:2px 0}
.sw{display:grid;justify-items:center;gap:4px;background:none;border:0;padding:2px;font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.sw i{width:32px;height:32px;border-radius:50%;background:var(--c);border:1px solid var(--icon-stroke);display:block}
.sw.none i{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--line) 5px 7px)}
.sw[aria-pressed="true"]{color:var(--fg);font-weight:600}
.sw[aria-pressed="true"] i{outline:2px solid var(--accent);outline-offset:2px}
.set{display:grid;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.set h3{font-size:16px}
.set p{margin:0;font-size:14px}

.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-in{display:grid;gap:14px;justify-items:center;text-align:center;width:100%;max-width:320px}
.gate-ic{width:72px;height:72px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.gate-ic svg{width:44px;height:44px}
.gate p{margin:0;color:var(--muted)}
.gate input{width:100%;font:500 30px var(--mono);letter-spacing:.5em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.gate .btn{width:100%}
.gate-err{color:var(--bad)!important;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:380px){.photo{grid-template-columns:104px minmax(0,1fr)}.seg button{font-size:12px}}
</style>

</head>
<body>
<header class="top">
  <div><h1 id="h-title">Schrank</h1><div class="h-sub mono" id="h-sub"></div></div>
  <button type="button" class="icon-btn" data-a="settings" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
</header>

<main>
  <section id="v-schrank"></section>
  <section id="v-outfit" hidden></section>
  <section id="v-pack" hidden></section>
</main>

<button type="button" class="fab" id="fab" data-a="new-item">+ Teil</button>

<nav class="tabs" aria-label="Bereiche">
  <button type="button" class="tab" data-a="tab" data-v="schrank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5a2 2 0 1 1 2 2v1.3L3.4 15.2a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8L12 8.8"/></svg>Schrank</button>
  <button type="button" class="tab" data-a="tab" data-v="outfit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M8 4 3 7l2 4 2-1v10h10V10l2 1 2-4-5-3c-.6 1.5-2 2.5-4 2.5S8.6 5.5 8 4Z"/></svg>Outfit</button>
  <button type="button" class="tab" data-a="tab" data-v="pack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8ZM9 8V6a3 3 0 0 1 6 0v2"/></svg>Packliste</button>
</nav>

<div id="sheet" class="scrim" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ========== Grunddaten ========== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoDate(new Date());
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return isoDate(d);};
const fmtDate=iso=>{if(!iso)return '–';const [y,m,d]=iso.split('-');return `${d}.${m}.${y}`;};
const fmtTs=ts=>{const d=new Date(ts);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;};

function lum(hex){const n=parseInt(hex.slice(1),16);const ch=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  const Y=.2126*ch[0]+.7152*ch[1]+.0722*ch[2];return (Y>.008856?116*Math.cbrt(Y)-16:903.3*Y)/100;}

const COLORS=[['Schwarz','#1c1c1e','n'],['Weiß','#f7f7f5','n'],['Hellgrau','#c4c5c2','n'],['Anthrazit','#4a4d52','n'],['Navy','#1f2b4d','n'],['Denim','#4a6a94','n'],['Beige/Sand','#d8c6a3','n'],['Braun','#7a5232','n'],['Olive/Khaki','#6f7045','n'],

function weatherRules(t,rain){
  if(t>22)return {layer:'none',jacket:rain?'opt':'none',either:false,jTypes:rain?['Regenjacke']:[],shorts:true,sandals:true,band:'Über 22 °C',text:'Nur Basis, Shorts ok'+(rain?' · Regen → Regenjacke':'')};

  if(t>=8)return {layer:'opt',jacket:rain?'req':'opt',either:!rain,jTypes:rain?['Regenjacke']:['Übergangsjacke','Regenjacke','Sportjacke','Weste','Blazer/Sakko'],shorts:false,sandals:false,band:'8–15 °C',text:rain?'Regen → Regenjacke':'Zweite Schicht oder Übergangsjacke'};
  return {layer:'req',jacket:'req',either:false,jTypes:['Winterjacke'],shorts:false,sandals:false,band:'Unter 8 °C',text:'Zweite Schicht + Winterjacke',cold:true};
}
function accentOk(arr){const acc=[...new Set(arr.map(i=>i.color).filter(c=>COL[c]?.accent))];
  if(acc.length<=1)return true; return acc.length===2&&FAMILY[acc[0]]===FAMILY[acc[1]];}

function evalOutfit(o,{t,rain,R,pen}){
  if(o.layer&&!UNDER_OK.includes(o.basis.type))return null;
  const vis=[o.basis,o.layer,o.jacket,o.hose,o.shoes].filter(Boolean);
  const f=vis.filter(i=>!(i.cat==='jacke'&&WEATHER_J.includes(i.type))&&!(i===o.basis&&o.layer)).map(formal);
  const spread=Math.max(...f)-Math.min(...f);
  if(spread>2)return null;
  let sc=spread===0?3:spread===1?1:-2; const why=[];
  if(spread<=1)why.push([1,'Formalität passt zusammen']);
  const acc=[...new Set(vis.map(i=>i.color).filter(c=>COL[c]?.accent))];
  if(acc.length===0)sc+=1;
  else if(acc.length===1){sc+=2;why.push([2,`Eine Akzentfarbe: ${acc[0]}`]);}
  else if(acc.length===2&&FAMILY[acc[0]]===FAMILY[acc[1]]){sc+=1;why.push([2,`${acc[0]} + ${acc[1]}: gleiche Farbfamilie`]);}
  else sc-=25;
  if(vis.filter(i=>i.pattern==='gemustert').length>1)sc-=20;
  const top=o.layer||o.basis,d=Math.abs((COL[top.color]?.L??.5)-(COL[o.hose.color]?.L??.5));
  const setCount=new Map();for(const i of vis)if(i.set)setCount.set(i.set,(setCount.get(i.set)||0)+1);
  const fullSets=[...setCount].filter(([,n])=>n>=2).map(([k])=>k);
  const setTH=!!top.set&&top.set===o.hose.set;
  const allBlack=[o.basis,o.layer,o.hose].filter(Boolean).every(i=>i.color==='Schwarz'||i.color==='Anthrazit');
  if(fullSets.length){sc+=1;fullSets.forEach(k=>why.push([6,`Set: ${k}`]));}
  if(allBlack){sc+=5;why.push([5,'All Black']);}
  if(d>=.35){sc+=5;why.push([3,'Starker Hell-Dunkel-Kontrast oben/unten']);}
  else if(d>=.2){sc+=2;why.push([1,'Guter Kontrast oben/unten']);}
  else if(d<.1&&!allBlack&&!setTH)sc-=3;
  const favs=vis.filter(i=>i.fav);
  if(favs.length&&favOn()){sc+=1.5*Math.min(3,favs.length);why.push([1,favs.length===1?`Favorit: ${dname(favs[0])}`:`${favs.length} Favoriten dabei`]);}
  const cols=[...new Set(vis.map(i=>i.color))];let pc=0;
  for(let a=0;a<cols.length;a++)for(let b=a+1;b<cols.length;b++){if(pc<3&&GOOD.has(pairKey(cols[a],cols[b]))){pc++;sc+=3;why.push([4,`${cols[a]} + ${cols[b]}: bewährtes Paar`]);}}
  if(o.shoes.color==='Braun'&&o.hose.color==='Schwarz')sc-=10;
  if(o.hose.color==='Denim'&&[o.basis,o.layer,o.jacket].some(i=>i&&i.color==='Denim'&&!(i.set&&i.set===o.hose.set)))sc-=10;
  if(t>22&&/Shorts/.test(o.hose.type)){sc+=2;why.push([2,`Shorts bei ${t} °C`]);}
  if(o.layer){if(t<8&&o.layer.seasons.includes('Winter'))sc+=2;if(R.layer==='none')sc-=4;}
  if(o.jacket){
    if(rain&&o.jacket.type==='Regenjacke')why.push([5,'Regen → Regenjacke']);
    else if(t<8)why.push([3,`${o.jacket.type} bei ${t} °C`]);
    else why.push([1,`${o.jacket.type} für ${t} °C`]);
    if(R.jacket==='none')sc-=4;}
  if(t<10&&o.shoes.type==='Boots')sc+=2;
  if(t>=20&&o.shoes.type==='Boots')sc-=3;
  for(const i of vis)if(pen.has(i.id))sc+=pen.get(i.id);
  const key=[o.basis,o.layer,o.hose,o.shoes].map(i=>i?i.id:'-').join('|');
  const ri=S.meta.recent.indexOf(key);if(ri>=0)sc-=8-Math.floor(ri/3);
  sc+=Math.random()*3;
  why.sort((a,b)=>b[0]-a[0]);
  return {o,score:sc,key,reasons:why.slice(0,3).map(w=>w[1])};
}

function trim(lists,max){
  const est=()=>lists.reduce((a,l)=>a*l.length,1);
  while(est()>max){const big=lists.reduce((a,l)=>l.length>a.length?l:a);const keep=big.filter(x=>x===null);
    const rest=big.filter(x=>x!==null).sort(()=>Math.random()-.5);rest.length=Math.max(1,Math.floor(rest.length*.7));big.length=0;big.push(...keep,...rest);}
}
function suggest({style,t,rain,pin}){
  const R=weatherRules(t,rain),pinI=pin?S.items.find(i=>i.id===pin):null,has=i=>i.styles.includes(style),pen=new Map(),notes=[];
  const sea=seasonFor(t);const P=c=>S.items.filter(i=>i.cat===c&&has(i)&&!i.blacklist&&seasonOk(i,sea));
  const coverIds=new Set();

  let layers=P('schicht');

    if(alt.length){alt.forEach(i=>pen.set(i.id,-4));notes.push(`Keine ${R.jTypes.join('/')} als ${style} getaggt, nehme trotzdem eine.`);}

    jackets=alt;
  }
  if(pinI&&pinI.set)S.items.forEach(i=>{if(i!==pinI&&i.set===pinI.set)pen.set(i.id,(pen.get(i.id)||0)+6);});
  if(pinI){
    if(pinI.cat==='basis')basis=[pinI];if(pinI.cat==='hose')hose=[pinI];if(pinI.cat==='schuhe')shoes=[pinI];
    if(isBasic(pinI))coverIds.add(pinI.id);
    if(pinI.cat!=='kopf'&&!has(pinI)&&!isBasic(pinI))notes.push(`„${dname(pinI)}“ ist nicht als ${style} getaggt, wird aber trotzdem genutzt.`);
  }
  if(R.either&&!pinJ&&!pinL&&!jackets.length&&!(layers.length&&basis.some(b=>b.type==='T-Shirt'))){
    const alt=S.items.filter(i=>i.cat==='jacke'&&R.jTypes.includes(i.type)&&!noOutfit(i)&&!i.blacklist&&seasonOk(i,sea));
    if(alt.length){alt.forEach(i=>pen.set(i.id,(pen.get(i.id)||0)-4));jackets=alt;notes.push(`Keine passende Jacke als ${style} getaggt, nehme trotzdem eine.`);}
  }
  const missing=[];if(!basis.length)missing.push('Basis-Oberteil');if(!hose.length)missing.push('Hose');if(!shoes.length)missing.push('Schuhe');
  if(missing.length)return {error:`Für ${style} fehlt noch: ${missing.join(', ')}. Tagge passende Teile mit „${style}“.`,notes};
  let lo=pinL?[pinI]:R.layer==='none'?[null]:[null,...layers];
  if(R.layer==='req'&&!layers.length&&!pinL)notes.push(`Keine zweite Schicht als ${style} getaggt.`);
  let jo=pinJ?[pinI]:R.jacket==='none'?[null]:R.jacket==='opt'?[null,...jackets]:(jackets.length?[...jackets]:[null]);
  if(R.jacket==='req'&&!jackets.length&&!pinJ)notes.push('Keine passende Jacke gefunden.');
  const canEither=layers.length||jackets.length||pinL||pinJ;
  basis=[...basis];hose=[...hose];shoes=[...shoes];
  trim([basis,lo,jo,hose,shoes],300000);
  const out=[];
  for(const b of basis)for(const l of lo)for(const j of jo){
    if(R.either&&!l&&!j&&canEither)continue;
    if(R.layer==='req'&&!l&&layers.length&&!NO_LAYER_OK.includes(b.type))continue;
    if(!l&&coverIds.has(b.id))continue;
    for(const h of hose)for(const s of shoes){const r=evalOutfit({basis:b,layer:l,jacket:j,hose:h,shoes:s},{t,rain,R,pen});if(r)out.push(r);}
  }
  if(!out.length)return {error:'Keine stimmige Kombination gefunden. Meist liegen die Formalitäten zu weit auseinander (z. B. Hemd + Hoodie). Check die Stil-Tags.',notes};
  out.sort((a,b)=>b.score-a.score);
  const picks=[];
  for(const r of out){if(picks.every(p=>diffCount(p,r)>=2))picks.push(r);if(picks.length===3)break;}
  if(picks.length<3)for(const r of out){if(!picks.includes(r)&&picks.every(p=>diffCount(p,r)>=1))picks.push(r);if(picks.length===3)break;}
  const kopfPin=pinI&&pinI.cat==='kopf'?pinI:null;
  const muetze=!kopfPin&&(style==='Casual'||style==='Streetwear')&&t<8?S.items.filter(i=>i.type==='Mütze'&&has(i)&&!i.blacklist).sort((a,b)=>(COL[a.color]?.accent?1:0)-(COL[b.color]?.accent?1:0))[0]:null;
  picks.forEach(p=>{p.o.kopf=kopfPin||muetze||null;if(muetze)p.reasons.push('Mütze bei unter 8 °C');});

}
function computeSuggest(){
  const o=S.outfit;const pinI=o.pin&&S.items.find(i=>i.id===o.pin);if(o.pin&&(!pinI||NOSTYLE.includes(pinI.cat)))o.pin=null;
  let style=o.style;
  if(style==='Zufall'){
    const ok=OUTFIT_STYLES.filter(s=>(!pinI||pinI.cat==='kopf'||pinI.cat==='jacke'||pinI.styles.includes(s))&&['basis','hose','schuhe'].every(c=>S.items.some(i=>i.cat===c&&i.styles.includes(s))));
    style=ok.length?ok[Math.floor(Math.random()*ok.length)]:'Casual';o.rolled=style;
  } else o.rolled=null;
  o.results=suggest({style,t:o.t,rain:o.rain,pin:o.pin});o.results.style=style;
  if(o.results.list){for(const r of o.results.list)S.meta.recent.unshift(r.key);S.meta.recent=[...new Set(S.meta.recent)].slice(0,15);put('meta',S.meta);}
}

/* ========== Packlisten-Logik ========== */
function validTriple(b,h,s,st=OUTFIT_STYLES,cover=false){
  const cv=cover&&((b.type==='T-Shirt'&&!noOutfit(b))||isBasic(b));
  if(!st.some(x=>(cv||b.styles.includes(x))&&h.styles.includes(x)&&s.styles.includes(x)))return false;
  const f=cv?[formal(h),formal(s)]:[formal(b),formal(h),formal(s)];if(Math.max(...f)-Math.min(...f)>2)return false;
  if(!accentOk([b,h,s]))return false;
  if([b,h,s].filter(i=>i.pattern==='gemustert').length>1)return false;
  if(s.color==='Braun'&&h.color==='Schwarz')return false;
  if(h.color==='Denim'&&b.color==='Denim')return false;
  return true;
}
function packDays(p){if(!p.start||!p.end)return 1;return Math.max(1,Math.round((Date.parse(p.end)-Date.parse(p.start))/864e5)+1);}
function packD(p){const days=packDays(p);return p.wash>0?Math.min(days,p.wash):days;}
function buildPack(p){
  const ITEMS=S.items.filter(i=>!i.blacklist);
  const days=packDays(p),D=packD(p),cl=p.climate,warn=[];
  const F=Math.min(Math.max(0,p.fancyDays||0),D),E=D-F;
  const used=new Map(),qty=i=>used.get(i)||0,entries=[];
  const push=(i,n=1,wear=false)=>{used.set(i,qty(i)+n);const e=entries.find(x=>x.itemId===i.id&&x.wear===wear);if(e)e.qty+=n;else entries.push({itemId:i.id,qty:n,packed:false,wear,auto:true});};
  const climOk=i=>{if(cl==='warm'&&!seasonOk(i,'Sommer'))return false;if(cl==='kalt'&&!seasonOk(i,'Winter'))return false;
    if(cl==='gemischt'&&!seasonOk(i,'Übergang')&&!seasonOk(i,'Sommer'))return false;
    if(cl!=='warm'&&i.type==='Sandalen/Slides')return false;if(cl==='kalt'&&/Shorts/.test(i.type))return false;return true;};
  const cyc=(arr,n)=>{let left=n,prog=true;while(left>0&&prog){prog=false;for(const i of arr){if(left<=0)break;if(qty(i)<i.count){push(i);left--;prog=true;}}}return n-left;};
  /* Reise-Fit (An-/Abreise) */
  const travel=new Set();
  if(p.travelFit){
    const G=ITEMS.filter(i=>i.styles.includes('Gemütlich')).sort((a,b)=>favOn()?(b.fav?1:0)-(a.fav?1:0):0);
    const findTop=f=>G.find(i=>f(i)&&i.cat==='schicht')||G.find(i=>f(i)&&i.cat==='basis')||G.find(i=>f(i)&&i.cat==='jacke');
    let top=null,bottom=null,extra=[];
    for(const n of [...new Set(G.filter(i=>i.set).map(i=>i.set))]){const t=findTop(i=>i.set===n),h=G.find(i=>i.set===n&&i.cat==='hose');
      if(t&&h){top=t;bottom=h;extra=G.filter(i=>i.set===n&&i!==t&&i!==h&&['basis','schicht','jacke'].includes(i.cat));break;}}
    if(!top)top=findTop(()=>true);if(!bottom)bottom=G.find(i=>i.cat==='hose');
    [top,bottom,...extra].forEach(i=>{if(i){push(i,1,true);travel.add(i);}});
    if(!top||!bottom)warn.push('Für das Reise-Fit fehlt ein Teil mit Tag „Gemütlich“ ('+[!top&&'Oberteil',!bottom&&'Hose'].filter(Boolean).join(', ')+').');
  }
  /* Tage aufteilen: F schick, E Casual/Streetwear */
  const TRI=['schuhe','hose','basis'];
  const portion=(st,T,cover=false)=>{
    const maxB=cover?(cl==='kalt'?T.basis:Math.floor(T.basis/2)):0;let nB=0;
    const pool=c=>ITEMS.filter(i=>i.cat===c&&climOk(i)&&!travel.has(i)&&(i.styles.some(x=>st.includes(x))||(cover&&c==='basis'&&((i.type==='T-Shirt'&&!noOutfit(i))||isBasic(i)))));
    const P={basis:pool('basis'),hose:pool('hose'),schuhe:pool('schuhe')},ch={basis:[],hose:[],schuhe:[]},got={basis:0,hose:0,schuhe:0};
    const gain=(sl,i)=>{const [x,y]=TRI.filter(z=>z!==sl);const A=ch[x].length?ch[x]:P[x],B=ch[y].length?ch[y]:P[y];let n=0;
      for(const a of A)for(const b of B){const t={[sl]:i,[x]:a,[y]:b};if(validTriple(t.basis,t.hose,t.schuhe,st,cover))n++;}return n;};
    const pick=sl=>{let best=null,bs=-Infinity;for(const i of P[sl]){if(qty(i)>=i.count)continue;if(sl==='basis'&&isBasic(i)&&nB>=maxB)continue;let v=gain(sl,i);if(qty(i)>0)v-=1000;
      if(ch[sl].some(e=>e!==i&&e.type===i.type&&e.color===i.color))v*=.5;if(i.fav&&favOn())v=v*1.3+1;v+=Math.random()*.1;if(v>bs){bs=v;best=i;}}return best;};
    for(const sl of TRI){while(got[sl]<T[sl]){const i=pick(sl);if(!i)break;if(isBasic(i))nB++;if(!ch[sl].includes(i))ch[sl].push(i);push(i);got[sl]++;}}
    return {ch,got};
  };
  const TS={basis:F,hose:Math.max(1,Math.ceil(F/3)),schuhe:1},TE={basis:E,hose:Math.max(1,Math.ceil(E/3)),schuhe:(F>0||D===1)?1:2};
  const coverSchick=cl!=='warm'&&ITEMS.some(i=>i.cat==='schicht'&&i.styles.includes('Schick')&&climOk(i));
  const coverE=cl!=='warm'&&ITEMS.some(i=>i.cat==='schicht'&&!noOutfit(i)&&climOk(i));
  const rs=F>0?portion(['Schick'],TS,coverSchick):null,re=E>0?portion(['Casual','Streetwear'],TE,coverE):null;
  const lab={basis:'Basis-Oberteile',hose:'Hosen',schuhe:'Paar Schuhe'};
  for(const sl of TRI){
    if(rs&&rs.got[sl]<TS[sl])warn.push(`Nur ${rs.got[sl]} schicke ${lab[sl]} verfügbar (geplant: ${TS[sl]}).`);
    if(re&&re.got[sl]<TE[sl])warn.push(`Nur ${re.got[sl]} ${lab[sl]} für Casual/Streetwear verfügbar (geplant: ${TE[sl]}).`);
  }
  const all=sl=>[...(rs?rs.ch[sl]:[]),...(re?re.ch[sl]:[])];
  const Bs=all('basis'),Hs=all('hose'),Sh=all('schuhe');
  /* Zweite Schicht */
  const Tl=cl==='warm'?1:cl==='gemischt'?Math.min(2,D):Math.min(3,D);
  const fitsL=l=>{let n=0;for(const b of Bs.filter(x=>UNDER_OK.includes(x.type)))for(const h of Hs){const f=[formal(l),formal(b),formal(h)];if(Math.max(...f)-Math.min(...f)<=2&&accentOk([l,b,h]))n++;}return n;};
  let nl=0;
  if(rs&&rs.ch.basis.some(b=>!b.styles.includes('Schick'))){
    const sl=ITEMS.filter(i=>i.cat==='schicht'&&i.styles.includes('Schick')&&climOk(i)&&!travel.has(i)).sort((a,b)=>(b.fav&&favOn()?1:0)-(a.fav&&favOn()?1:0))[0];
    if(sl){push(sl);nl++;}else warn.push('Für die schicken Tage ist ein T-Shirt eingeplant, aber kein schicker Pullover vorhanden.');
  }
  ITEMS.filter(i=>i.cat==='schicht'&&climOk(i)&&!travel.has(i)&&!noOutfit(i))
    .map(l=>({l,s:fitsL(l)+(cl==='kalt'&&l.seasons.includes('Winter')?2:0)+(cl==='warm'&&l.seasons.includes('Sommer')?2:0)+(l.fav&&favOn()?2:0)})).sort((a,b)=>b.s-a.s)
    .forEach(({l})=>{if(nl<Tl&&qty(l)<l.count){push(l);nl++;}});
  if(Bs.some(isBasic)&&!nl)warn.push('Basic-T-Shirts sind eingeplant, aber kein Pullover zum Drüberziehen.');
  if(nl&&!Bs.some(b=>UNDER_OK.includes(b.type)))warn.push('Unter Pullover/Hoodies gehören T-Shirts, es ist aber keins eingeplant.');
  /* Jacke */
  if(cl!=='warm'){
    const J=ITEMS.filter(i=>i.cat==='jacke'&&climOk(i)&&!noOutfit(i)),fitsJ=j=>Hs.filter(h=>accentOk([j,h])).length;
    const pref=cl==='kalt'?['Winterjacke']:['Übergangsjacke','Regenjacke','Sportjacke','Weste'];let found=null;
    for(const ty of pref){const c=J.filter(j=>j.type===ty).sort((a,b)=>fitsJ(b)+(b.fav&&favOn()?1:0)-fitsJ(a)-(a.fav&&favOn()?1:0));if(c.length){found=c[0];break;}}
    if(!found&&cl==='kalt'){found=J.find(j=>j.type==='Übergangsjacke')||null;warn.push(found?'Keine Winterjacke gefunden, Übergangsjacke eingeplant.':'Keine Winterjacke gefunden.');}
    if(found)push(found);
  }
  if(cl==='kalt'){const m=ITEMS.find(i=>i.type==='Mütze'&&!noOutfit(i));if(m)push(m);}
  /* Unterwäsche */
  const want=new Set(Sh.map(i=>i.sock));
  const fill=(type,target,label)=>{const its=ITEMS.filter(i=>i.type===type).sort((a,b)=>(want.has(b.color.toLowerCase())?1:0)-(want.has(a.color.toLowerCase())?1:0));
    const got=cyc(its,target);if(got<target)warn.push(`Nur ${got} ${label} vorhanden (geplant: ${target}).`);};
  fill('Unterhose',D+1,'Unterhosen');fill('Socken',D+1,'Paar Socken');
  /* Schlafen: 1 Set pro angefangene 4 Nächte */
  const nights=Math.max(1,days-1),N=p.wash>0?Math.min(nights,p.wash):nights,sets=Math.ceil(N/4);
  const prefB=cl==='kalt'?'Schlafhose':'Schlafshorts';
  const tops=ITEMS.filter(i=>i.type==='Schlafshirt'),bots=[...ITEMS.filter(i=>i.type===prefB),...ITEMS.filter(i=>i.cat==='schlaf'&&i.type!=='Schlafshirt'&&i.type!==prefB)];
  if(!tops.length&&!bots.length)warn.push('Keine Schlafsachen im Schrank.');else{cyc(tops,sets);cyc(bots,sets);}
  return {entries,warn};
}
function recalcPack(p){
  const old=new Map(p.entries.map(e=>[e.itemId,e]));const r=buildPack(p);
  const manual=p.entries.filter(e=>!e.auto);
  const auto=r.entries.filter(e=>!manual.some(m=>m.itemId===e.itemId)).map(e=>{const o=old.get(e.itemId);return o?{...e,packed:o.packed,wear:e.wear||o.wear}:e;});
  p.entries=[...auto,...manual];p.warn=r.warn;
}
function countOutfits(entries,cl){
  const its=entries.map(e=>S.items.find(i=>i.id===e.itemId)).filter(Boolean);
  const B=its.filter(i=>i.cat==='basis'),H=its.filter(i=>i.cat==='hose'),Sh=its.filter(i=>i.cat==='schuhe');
  const cover=cl!=='warm'&&its.some(i=>i.cat==='schicht');
  let n=0;for(const b of B)for(const h of H)for(const s of Sh)if(validTriple(b,h,s,OUTFIT_STYLES,cover))n++;return n;
}

function fileToPhoto(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const max=1000,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    res(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.85));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});}

function doImport(data,replace){
  const items=data.items.filter(x=>x&&x.id&&CATS[x.cat]).map(migrate);
  const outfits=(data.outfits||[]).filter(x=>x&&x.id&&x.ids),packs=(data.packs||[]).filter(x=>x&&x.id&&Array.isArray(x.entries));
  const merge=(cur,add)=>{const m=new Map(cur.map(x=>[x.id,x]));add.forEach(x=>m.set(x.id,x));return [...m.values()];};
  const nI=replace?items:merge(S.items,items),nO=replace?outfits:merge(S.outfits,outfits),nP=replace?packs:merge(S.packs,packs);
  const st=data.settings||{},meta={...S.meta,id:'meta',unlocked:true,seeded:true,exV2:true,exV3:true};
  if(replace){if(typeof st.favBoost==='boolean')meta.favBoost=st.favBoost;meta.recent=Array.isArray(st.recent)?st.recent:[];}
  return new Promise((res,rej)=>{
    const apply=()=>{S.items=nI;S.outfits=nO;S.packs=nP;S.meta=meta;try{localStorage.setItem('ks-unlocked','1');}catch(e){}res();};
    if(!DB.db){apply();return;}
    try{const tx=DB.db.transaction(['items','outfits','packs','meta'],'readwrite'),os=n=>tx.objectStore(n);
      if(replace)['items','outfits','packs'].forEach(n=>os(n).clear());
      items.forEach(x=>os('items').put(x));outfits.forEach(x=>os('outfits').put(x));packs.forEach(x=>os('packs').put(x));os('meta').put(meta);
      tx.oncomplete=apply;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
    }catch(e){rej(e);}
  });
}
function openImportConfirm(data){
  const n=a=>Array.isArray(a)?a.length:0,photos=data.items.filter(i=>i&&i.photo).length,when=data.exported?fmtTs(Date.parse(data.exported)):'unbekannt';
  const exN=S.items.filter(i=>i.example).length;
  openSheet(`<div class="sh-head"><button type="button" class="link" data-a="close-sheet">Abbrechen</button><h2>Import</h2><span style="width:60px"></span></div>
  <div class="form">
    <div class="card"><span class="lab">In der Datei</span><p style="margin:0"><b class="mono">${n(data.items)}</b> Teile, davon <span class="mono">${photos}</span> mit Foto · <b class="mono">${n(data.outfits)}</b> Outfits · <b class="mono">${n(data.packs)}</b> Packlisten</p><p class="hint">Exportiert am ${when}</p></div>
    <div class="card"><span class="lab">Auf diesem Gerät</span><p style="margin:0"><b class="mono">${S.items.length}</b> Teile${exN?`, davon <span class="mono">${exN}</span> Beispiele`:''} · <b class="mono">${S.outfits.length}</b> Outfits · <b class="mono">${S.packs.length}</b> Packlisten</p></div>
    <p class="note">Sollen die bestehenden Daten auf diesem Gerät ersetzt werden?</p>
    <button type="button" class="btn danger" id="im-rep">Ja, alles ersetzen</button>
    <p class="hint">Löscht alles auf diesem Gerät und übernimmt die Datei 1:1, inklusive Einstellungen.</p>
    <button type="button" class="btn" id="im-mrg">Nein, zusammenführen</button>
    <p class="hint">Behält alles hier und fügt die Datei hinzu. Teile, die es schon gibt, bekommen den Stand aus der Datei.</p>
    <p class="note" id="im-st" hidden></p>
  </div>`,panel=>{
    const btns=()=>panel.querySelectorAll('button');
    const run=async replace=>{btns().forEach(b=>b.disabled=true);const st=$('#im-st',panel);st.hidden=false;st.textContent='Importiere … App bitte offen lassen.';
      try{await doImport(data,replace);const saved=S.dbOk?(await dbAll('items')).length:S.items.length;
        S.outfit.results=null;S.outfit.pin=null;S.packOpen=null;closeSheet();renderAll();
        toast(saved===S.items.length?`Import fertig: ${S.items.length} Teile`:`Achtung: nur ${saved} von ${S.items.length} Teilen gespeichert`);}
      catch(err){st.textContent='Import fehlgeschlagen. Auf diesem Gerät wurde nichts geändert.';btns().forEach(b=>b.disabled=false);}};
    $('#im-rep',panel).addEventListener('click',e=>{const b=e.currentTarget;if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Sicher? Nochmal tippen zum Ersetzen';return;}run(true);});
    $('#im-mrg',panel).addEventListener('click',()=>run(false));
  });
}
function openSettings(){
  const ex=S.items.filter(i=>i.example).length;
  openSheet(`<div class="sh-head"><span style="width:60px"></span><h2>Einstellungen</h2><button type="button" class="link strong" data-a="close-sheet">Fertig</button></div>
  <div class="set"><h3>Einladungscode</h3><p>Zum Weitergeben an Freunde: <b class="mono">${INVITE}</b>. Der Code hält zufällige Besucher ab, ist aber kein echter Schutz.</p></div>
  <div class="set"><h3>Wetter</h3><p>Standort Hamburg. Das Live-Wetter kommt von Open-Meteo. Es wird beim Öffnen der App geladen. Mit dem Regler kannst du es jederzeit überschreiben.</p></div>
  <div class="set"><h3>Favoriten</h3><label class="tgl"><input type="checkbox" id="s-fav"${favOn()?' checked':''}>In Outfits und Packlisten bevorzugen</label><p class="hint">Aus: Favoriten bleiben markiert und filterbar, beeinflussen aber keine Vorschläge. Bestehende Packlisten ändern sich erst mit „Neu vorschlagen“.</p></div>
  <div class="set"><h3>Umzug &amp; Backup</h3><p>Exportiert alles in eine Datei: Teile mit Fotos, Sets, Blacklist, Favoriten, Outfits, Packlisten und Einstellungen. Die Datei kannst du per AirDrop aufs andere iPhone schicken oder in iCloud Drive sichern.</p>
    <div class="acts"><button type="button" class="btn primary" id="s-exp">Alles exportieren</button><label class="btn" for="s-imp">Datei importieren</label><input class="vh" type="file" id="s-imp"></div>
    <p class="hint">Beim Import fragt die App, ob die Daten hier ersetzt werden sollen. Tipp: regelmäßig exportieren und in iCloud Drive sichern. Wenn du die App vom Home-Bildschirm löschst, sind die Daten weg.</p></div>
  <div class="set"><h3>Daten</h3><p><span class="mono">${S.items.length}</span> Teile, davon <span class="mono">${ex}</span> Beispiele · <span id="s-size" class="mono">…</span></p>
    ${S.dbOk?'':'<p class="warn">Speicher nicht verfügbar: Änderungen gehen beim Neuladen verloren.</p>'}
    <div class="acts">${ex?'<button type="button" class="btn" id="s-ex">Beispielteile entfernen</button>':''}<button type="button" class="btn danger" id="s-wipe">Alles löschen</button></div></div>
  ${(navigator.standalone||matchMedia('(display-mode: standalone)').matches)?'':'<p class="warn">Du nutzt die App gerade im Browser. Diese Daten sind getrennt von der App auf dem Home-Bildschirm. Erfass deine Teile nur in der Home-Bildschirm-App.</p>'}<p class="hint">Version 2.8 · Daten liegen nur lokal auf diesem Gerät.</p>`,panel=>{
    if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{$('#s-size',panel).textContent=`≈ ${(e.usage/1048576).toFixed(1).replace('.',',')} MB belegt`;}).catch(()=>{$('#s-size',panel).textContent='';});
    else $('#s-size',panel).textContent='';
    $('#s-fav',panel).addEventListener('change',e=>{S.meta.favBoost=e.target.checked;put('meta',S.meta);S.outfit.results=null;toast(e.target.checked?'Favoriten werden bevorzugt':'Favoriten werden nicht bevorzugt');});
    $('#s-exp',panel).addEventListener('click',async()=>{
      const data={app:'kleiderschrank',version:2,exported:new Date().toISOString(),items:S.items,outfits:S.outfits,packs:S.packs,settings:{favBoost:favOn(),recent:S.meta.recent||[]}};
      const name=`kleiderschrank-${todayISO()}.json`,blob=new Blob([JSON.stringify(data)],{type:'application/json'});
      try{const file=new File([blob],name,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});toast('Export geteilt');return;}}
      catch(err){if(err&&err.name==='AbortError')return;}
      try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Export heruntergeladen');}
      catch(err){toast('Export nicht möglich');}});
    $('#s-imp',panel).addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
      let data;try{data=JSON.parse(await f.text());if(!data||!Array.isArray(data.items))throw 0;}catch(err){toast('Datei ist kein gültiges Kleiderschrank-Backup');return;}
      openImportConfirm(data);});
    const exb=$('#s-ex',panel);if(exb)exb.addEventListener('click',()=>{
      const ids=new Set(S.items.filter(i=>i.example).map(i=>i.id));
      ids.forEach(id=>del('items',id));S.items=S.items.filter(i=>!ids.has(i.id));
      S.outfits=S.outfits.filter(o=>{const hit=Object.values(o.ids).some(id=>ids.has(id));if(hit)del('outfits',o.id);return !hit;});
      S.packs=S.packs.filter(p=>{if(p.example){del('packs',p.id);return false;}p.entries=p.entries.filter(e=>!ids.has(e.itemId));put('packs',p);return true;});
      if(S.outfit.pin&&ids.has(S.outfit.pin))S.outfit.pin=null;S.packOpen=null;S.outfit.results=null;closeSheet();renderAll();toast('Beispiele entfernt');});
    $('#s-wipe',panel).addEventListener('click',e=>{const b=e.currentTarget;if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Wirklich alles löschen?';return;}
      ['items','outfits','packs'].forEach(clearStore);S.items=[];S.outfits=[];S.packs=[];S.outfit.pin=null;S.packOpen=null;S.outfit.results=null;closeSheet();renderAll();toast('Alles gelöscht');});
  });
}

/* ========== Events ========== */
const curPack=()=>S.packs.find(x=>x.id===S.packOpen);
const ACT={
  'tab':a=>{S.view=a.dataset.v;if(S.view!=='pack')S.packOpen=null;renderAll();scrollTo(0,0);},
  'settings':()=>openSettings(),
  'close-sheet':()=>closeSheet(),
  'new-item':()=>openItem(null),
  'item':a=>openItem(a.dataset.id),
  'fstyle':a=>{S.filters.style=a.dataset.v;renderSchrank();},
  'ffav':()=>{S.filters.fav=!S.filters.fav;renderSchrank();},
  'fbl':()=>{S.filters.bl=!S.filters.bl;renderSchrank();},
  'ostyle':a=>{S.outfit.style=a.dataset.v;runSuggest();},
  'suggest':()=>runSuggest(),
  'pin-pick':()=>openPicker({title:'Teil festsetzen',filter:i=>!NOSTYLE.includes(i.cat)&&(!noOutfit(i)||isBasic(i))&&!i.blacklist,onDone:([id])=>{S.outfit.pin=id;runSuggest();}}),
  'pin-item':a=>{S.outfit.pin=a.dataset.id;runSuggest();scrollTo(0,0);},
  'unpin':()=>{S.outfit.pin=null;runSuggest();},
  'save-outfit':a=>{const r=S.outfit.results?.list?.[+a.dataset.i];if(!r||r.saved)return;const ids={};SLOTS.forEach(([k])=>{if(r.o[k])ids[k]=r.o[k].id;});
    const so={id:uid(),ids,style:S.outfit.results.style,created:Date.now()};S.outfits.push(so);put('outfits',so);r.saved=true;renderOutfit();toast('Outfit gespeichert');},
  'del-outfit':a=>{S.outfits=S.outfits.filter(o=>o.id!==a.dataset.id);del('outfits',a.dataset.id);renderOutfit();},
  'pack-new':()=>openPackForm(null),
  'pack-open':a=>{S.packOpen=a.dataset.id;renderPack();scrollTo(0,0);},
  'pack-back':()=>{S.packOpen=null;renderAll();},
  'pack-edit':()=>openPackForm(curPack()),
  'pack-recalc':()=>{const p=curPack();recalcPack(p);put('packs',p);renderPack();toast('Neu vorgeschlagen');},
  'pack-copy':()=>{const p=curPack();const c={...JSON.parse(JSON.stringify(p)),id:uid(),name:p.name.replace(/^Beispiel: /,'')+' (Kopie)',example:false,created:Date.now()};
    c.entries.forEach(e=>{e.packed=false;e.wear=false;});S.packs.push(c);put('packs',c);S.packOpen=c.id;renderAll();scrollTo(0,0);toast('Kopie erstellt');},
  'pack-del':a=>{if(!a.dataset.armed){a.dataset.armed='1';a.textContent='Wirklich löschen?';return;}const p=curPack();S.packs=S.packs.filter(x=>x!==p);del('packs',p.id);S.packOpen=null;renderAll();toast('Packliste gelöscht');},
  'pack-add':a=>{const p=curPack();openPicker({title:'Teile hinzufügen',filter:()=>true,multi:true,sportChip:true,startSport:a.dataset.sport==='1',selected:p.entries.map(e=>e.itemId),onDone:ids=>{
    ids.forEach(id=>{if(!p.entries.some(e=>e.itemId===id))p.entries.push({itemId:id,qty:1,packed:false,wear:false,auto:false});});put('packs',p);renderPack();}});},
  'pr-wear':a=>{const p=curPack(),e=p.entries[+a.dataset.i];e.wear=!e.wear;if(e.wear)e.packed=false;put('packs',p);renderPack();},
  'pr-rm':a=>{const p=curPack();p.entries.splice(+a.dataset.i,1);put('packs',p);renderPack();},
  'pr-qty':a=>{const p=curPack(),e=p.entries[+a.dataset.i],it=S.items.find(i=>i.id===e.itemId);const n=e.qty+Number(a.dataset.v);
    if(n<1)return;if(it&&n>it.count){toast(`Nur ${it.count}× im Schrank`);return;}e.qty=n;put('packs',p);renderPack();}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const fn=ACT[a.dataset.a];if(fn)fn(a,e);});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.filters.q=t.value;renderResults();}
  if(t.id==='wx-r'){S.outfit.t=Number(t.value);$('#wx-t').textContent=`${t.value} °C`;const R=weatherRules(S.outfit.t,S.outfit.rain);$('#wx-band').textContent=`${R.band}: ${R.text}`;}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='g-cat'){S.filters.cat=t.value;S.filters.type='';renderSchrank();}
  else if(t.id==='g-type'){S.filters.type=t.value;renderResults();}
  else if(t.id==='g-col'){S.filters.color=t.value;renderResults();}
  else if(t.id==='g-sea'){S.filters.season=t.value;renderResults();}
  else if(t.id==='wx-r'){S.outfit.src='manuell';runSuggest();}
  else if(t.id==='wx-rain'){S.outfit.rain=t.checked;S.outfit.src='manuell';runSuggest();}
  else if(t.dataset.pi!=null){const p=curPack();p.entries[+t.dataset.pi].packed=t.checked;put('packs',p);renderPack();}
});

/* ========== Wetter ========== */
async function fetchWeather(){
  try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),5000);
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=53.55&longitude=9.99&current=apparent_temperature,precipitation,weather_code&timezone=Europe%2FBerlin',{signal:ctl.signal});
    clearTimeout(to);const j=await r.json();const c=j.current;if(typeof c?.apparent_temperature!=='number')throw 0;
    S.outfit.t=Math.round(c.apparent_temperature);S.outfit.rain=c.precipitation>0.1||[51,53,55,61,63,65,80,81,82].includes(c.weather_code);S.outfit.src='live';
    S.outfit.results=null;if(S.view==='outfit')renderOutfit();
  }catch(e){S.outfit.src='manuell';}
}

/* ========== Einladungscode ========== */
function isUnlocked(){try{if(localStorage.getItem('ks-unlocked')==='1')return true;}catch(e){}return !!S.meta.unlocked;}
function showGate(){
  const g=document.createElement('div');g.className='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');
  g.innerHTML=`<div class="gate-in"><div class="gate-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5a2 2 0 1 1 2 2v1.3L3.4 15.2a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8L12 8.8"/></svg></div>
    <h1>Kleiderschrank</h1><p>Gib den Einladungscode ein, den du bekommen hast.</p>
    <input id="gate-c" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="Einladungscode">
    <button type="button" class="btn primary" id="gate-b">Freischalten</button><p class="gate-err" id="gate-e" hidden>Falscher Code. Versuch's nochmal.</p></div>`;
  document.body.appendChild(g);document.body.style.overflow='hidden';
  const go=()=>{const inp=$('#gate-c');if(inp.value.trim()===INVITE){S.meta.unlocked=true;put('meta',S.meta);try{localStorage.setItem('ks-unlocked','1');}catch(e){}g.remove();document.body.style.overflow='';toast('Freigeschaltet');}
    else{$('#gate-e').hidden=false;inp.value='';inp.focus();}};
  $('#gate-b').addEventListener('click',go);$('#gate-c').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>$('#gate-c').focus(),60);
}

/* ========== Start ========== */
async function init(){
  S.dbOk=await openDB();
  const [items,outfits,packs,meta]=await Promise.all([dbAll('items'),dbAll('outfits'),dbAll('packs'),dbAll('meta')]);
  S.items=items.map(migrate);S.outfits=outfits;S.packs=packs;
  const m=meta.find(x=>x.id==='meta');if(m)S.meta={...S.meta,...m};
  if(m&&(S.meta.schema||1)<4){S.items.forEach(it=>put('items',it));}
  S.meta.schema=4;
  if(!S.meta.seeded){
    exampleItems().forEach(it=>{S.items.push(it);put('items',it);});
    const p={id:'ex-pack',example:true,name:'Beispiel: Wochenende Berlin',start:addDays(7),end:addDays(9),wash:0,climate:'gemischt',sport:true,fancyDays:1,travelFit:true,entries:[],warn:[],created:Date.now()};
    recalcPack(p);S.packs.push(p);put('packs',p);
    S.meta.seeded=true;S.meta.exV2=true;put('meta',S.meta);
  }
  if(!S.meta.exV2){if(S.items.some(i=>i.example))exampleV2().forEach(it=>{S.items.push(it);put('items',it);});S.meta.exV2=true;put('meta',S.meta);}
  if(!S.meta.exV3){S.items.filter(i=>i.example&&!i.set).forEach(i=>{const n=i.brand==='Adidas'&&/^Training/.test(i.name)?'Adidas-Anzug':/^Gemütlich/.test(i.name)?'Reise-Set':'';if(n){i.set=n;put('items',i);}});S.meta.exV3=true;put('meta',S.meta);}
  S.packs.forEach(p=>{if(p.fancyDays==null){p.fancyDays=p.fancy?1:0;delete p.fancy;p.travelFit=!!p.example;if(p.example)recalcPack(p);put('packs',p);}});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  renderAll();fetchWeather();
  if(!isUnlocked())showGate();
}
init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
